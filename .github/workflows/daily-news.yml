name: Publish daily market news

on:
  schedule:
    # GitHub cron is UTC. Madrid 08:00 is 06:00 UTC in summer and 07:00 UTC
    # in winter. Keep separate expressions so github.event.schedule identifies
    # the intended slot even when GitHub starts a scheduled job late.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Madrid delivery hour
        id: delivery-time
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "0 6 * * *") utc_hour=06 ;;
            "0 7 * * *") utc_hour=07 ;;
            *) echo "send=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          madrid_hour="$(TZ=Europe/Madrid date --date="$(date -u +%F) ${utc_hour}:00 UTC" +%H)"
          echo "send=$([ "$madrid_hour" = "08" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish all pending market briefs
        if: github.event_name == 'workflow_dispatch' || steps.delivery-time.outputs.send == 'true'
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          test -n "$NEWS_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --request POST \
            --header "Authorization: Bearer $NEWS_CRON_SECRET" \
            https://magicbrain.es/api/jobs/news
