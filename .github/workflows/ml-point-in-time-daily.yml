name: ML point-in-time daily

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-point-in-time-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply ordered migrations
        run: npm run db:migrate
      - name: Produce today's snapshots
        run: npm run ml:produce -- daily --source scryfall --batch-size 250 --max-rows 100000
      - name: Mature exact-date labels
        run: npm run ml:produce -- mature-labels --source scryfall --batch-size 250 --max-rows 100000
