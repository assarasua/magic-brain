name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-not-used-outside-github-actions
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix integrations/magic-brain-mcp
      - run: npm ci --prefix tools/magic-brain-cli
      - run: npm ci --prefix integrations/magic-brain-dev-mcp
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
      - run: npm run build
      - run: npm run rules:build --prefix integrations/magic-brain-mcp
      - run: npm run check:packages
      - run: npm run test:packages
      - run: npm run build:packages
      - run: npm run metadata:validate --prefix integrations/magic-brain-mcp
