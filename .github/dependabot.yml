version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Next.js 16 currently resolves eslint-plugin-react 7, which does not
      # support ESLint 10 yet.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # typescript-eslint 8 currently requires TypeScript below 6.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
