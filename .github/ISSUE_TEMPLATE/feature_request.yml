name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and licensing impact
      description: Identify any new provider, dataset, personal data, or redistribution need.
